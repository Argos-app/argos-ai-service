apiVersion: v1
kind: Service
metadata:
    name: postgres
spec:
    selector: { app: postgres }
    ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
spec:
    serviceName: postgres
    replicas: 1
    selector:
        matchLabels: { app: postgres }
    template:
        metadata:
            labels: { app: postgres }
        spec:
            securityContext:
                fsGroup: 70
                fsGroupChangePolicy: OnRootMismatch
            containers:
                - name: postgres
                  image: argos-postgres-init:local
                  imagePullPolicy: IfNotPresent
                  ports: [{ name: postgres, containerPort: 5432 }]
                  env:
                      - {
                            name: POSTGRES_USER,
                            valueFrom:
                                { secretKeyRef: { name: argos-local-secrets, key: POSTGRES_USER } },
                        }
                      - {
                            name: POSTGRES_DB,
                            valueFrom:
                                { secretKeyRef: { name: argos-local-secrets, key: POSTGRES_DB } },
                        }
                      - {
                            name: POSTGRES_PASSWORD,
                            valueFrom:
                                {
                                    secretKeyRef:
                                        { name: argos-local-secrets, key: POSTGRES_PASSWORD },
                                },
                        }
                      - {
                            name: POSTGRES_READER_PASSWORD,
                            valueFrom:
                                {
                                    secretKeyRef:
                                        {
                                            name: argos-local-secrets,
                                            key: POSTGRES_READER_PASSWORD,
                                        },
                                },
                        }
                  startupProbe:
                      exec:
                          command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
                      periodSeconds: 5
                      failureThreshold: 30
                  livenessProbe:
                      exec:
                          command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
                      periodSeconds: 10
                      timeoutSeconds: 3
                  readinessProbe:
                      exec:
                          command:
                              [
                                  sh,
                                  -ec,
                                  'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" && psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT ready FROM public.local_environment_ready" | grep -qx t',
                              ]
                      periodSeconds: 5
                      timeoutSeconds: 5
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { cpu: 1, memory: 1Gi }
                  volumeMounts:
                      - { name: data, mountPath: /var/lib/postgresql/data }
            volumes:
                - name: data
                  persistentVolumeClaim: { claimName: postgres-data }
