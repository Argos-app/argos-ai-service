apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argos-local
resources:
    - namespace.yaml
    - storage.yaml
    - postgres.yaml
    - dependencies.yaml
    - applications.yaml
configMapGenerator:
    - name: argos-health-probes
      files:
          - health_probe.py
secretGenerator:
    - name: argos-local-secrets
      envs:
          - .env.local
