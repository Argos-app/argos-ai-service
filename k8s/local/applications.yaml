apiVersion: v1
kind: Service
metadata: { name: a2a-agent }
spec:
    selector: { app: a2a-agent }
    ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: a2a-agent }
spec:
    replicas: 1
    strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
    selector: { matchLabels: { app: a2a-agent } }
    template:
        metadata: { labels: { app: a2a-agent } }
        spec:
            securityContext:
                { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
            initContainers:
                - name: fix-a2a-state-volume-permissions
                  image: argos-a2a-agent:local
                  imagePullPolicy: IfNotPresent
                  command:
                      - python
                      - -c
                      - "import os; os.chown('/state', 10001, 10001); os.chmod('/state', 0o750)"
                  securityContext:
                      {
                          runAsNonRoot: false,
                          runAsUser: 0,
                          runAsGroup: 0,
                          allowPrivilegeEscalation: false,
                          readOnlyRootFilesystem: true,
                          capabilities: { drop: [ALL], add: [CHOWN, FOWNER] },
                      }
                  volumeMounts:
                      - { name: state, mountPath: /state }
            containers:
                - name: app
                  image: argos-a2a-agent:local
                  imagePullPolicy: IfNotPresent
                  ports: [{ name: http, containerPort: 8000 }]
                  env:
                      - { name: A2A_HOST, value: "0.0.0.0" }
                      - { name: A2A_PORT, value: "8000" }
                      - { name: A2A_ENDPOINT_URL, value: "http://a2a-agent:8000/a2a" }
                      - {
                            name: A2A_OBSERVABILITY_MONGO_URI,
                            value: "mongodb://mongo:27017/?replicaSet=rs0",
                        }
                      - { name: A2A_OBSERVABILITY_REDIS_URL, value: "redis://redis:6379/0" }
                      - { name: USER_USAGE_REDIS_KEY_PREFIX, value: "argos:usage:users:v1" }
                      - {
                            name: A2A_OBSERVABILITY_MONGO_DATABASE,
                            valueFrom:
                                {
                                    secretKeyRef:
                                        { name: argos-local-secrets, key: MONGO_DATABASE },
                                },
                        }
                      - { name: A2A_QDRANT_URL, value: "http://qdrant:6333" }
                      - { name: A2A_QDRANT_READ_API_KEY, value: local-qdrant-read-only }
                      - { name: A2A_QDRANT_WRITE_API_KEY, value: local-qdrant-index-writer }
                      - { name: A2A_QDRANT_COLLECTION, value: argos_local_documents }
                      - { name: A2A_QDRANT_VECTOR_SIZE, value: "64" }
                      - { name: A2A_MODEL_MODE, value: simulated }
                      - {
                            name: A2A_INTERNAL_SERVICE_TOKEN,
                            valueFrom:
                                {
                                    secretKeyRef:
                                        {
                                            name: argos-local-secrets,
                                            key: A2A_INTERNAL_SERVICE_TOKEN,
                                        },
                                },
                        }
                      - { name: A2A_RESOURCE_SERVER_URL, value: "http://a2a-agent:8000/a2a" }
                      - {
                            name: A2A_DELEGATION_ISSUER,
                            valueFrom:
                                {
                                    secretKeyRef:
                                        { name: argos-local-secrets, key: MCP_DELEGATION_ISSUER },
                                },
                        }
                      - {
                            name: A2A_TRUSTED_DELEGATION_KEYS,
                            valueFrom:
                                {
                                    secretKeyRef:
                                        {
                                            name: argos-local-secrets,
                                            key: MCP_DELEGATION_PUBLIC_KEYS,
                                        },
                                },
                        }
                      - {
                            name: POSTGRES_READER_PASSWORD,
                            valueFrom:
                                {
                                    secretKeyRef:
                                        {
                                            name: argos-local-secrets,
                                            key: POSTGRES_READER_PASSWORD,
                                        },
                                },
                        }
                      - {
                            name: POSTGRES_DB,
                            valueFrom:
                                { secretKeyRef: { name: argos-local-secrets, key: POSTGRES_DB } },
                        }
                      - {
                            name: A2A_PERMISSION_SQL_DSN,
                            value: "postgresql://argos_reader:$(POSTGRES_READER_PASSWORD)@postgres:5432/$(POSTGRES_DB)",
                        }
                      - { name: A2A_DOCUMENT_SOURCE_ROOT, value: /var/lib/argos/a2a/documents }
                      - { name: A2A_MANIFEST_PATH, value: /var/lib/argos/a2a/state/manifest.json }
                  startupProbe:
                      httpGet: { path: /health/live, port: http }
                      periodSeconds: 5
                      failureThreshold: 30
                      timeoutSeconds: 10
                  livenessProbe:
                      httpGet: { path: /health/live, port: http }
                      periodSeconds: 10
                      timeoutSeconds: 10
                  readinessProbe:
                      exec:
                          { command: [python, /opt/argos/health-probe/health_probe.py, a2a-agent] }
                      periodSeconds: 5
                      timeoutSeconds: 15
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { cpu: 1, memory: 1Gi }
                  securityContext:
                      {
                          allowPrivilegeEscalation: false,
                          readOnlyRootFilesystem: true,
                          capabilities: { drop: [ALL] },
                      }
                  volumeMounts:
                      - { name: tmp, mountPath: /tmp }
                      - { name: state, mountPath: /var/lib/argos/a2a/state }
                      - { name: probes, mountPath: /opt/argos/health-probe, readOnly: true }
            volumes:
                - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
                - { name: state, persistentVolumeClaim: { claimName: a2a-state } }
                - { name: probes, configMap: { name: argos-health-probes, defaultMode: 0444 } }
