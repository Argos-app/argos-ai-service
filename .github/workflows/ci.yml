name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: pylock.toml

            - name: Install Python tooling
              run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r pylock.toml

            - name: Ruff lint
              run: ruff check .

            - name: Ruff format check
              run: ruff format --check .

            - name: Compile Python sources
              shell: bash
              run: |
                  python - <<'PY'
                  import compileall
                  from pathlib import Path

                  roots = [Path("apps"), Path("packages"), Path("tests")]
                  for root in roots:
                      if root.exists() and not compileall.compile_dir(str(root), quiet=1):
                          raise SystemExit(f"compileall failed for {root}")
                  PY

            - name: Audit Python dependencies
              run: pip-audit

            - name: Generate disposable local secrets
              run: python scripts/docker/create-local-env.py --output .env.ci --force

            - name: Validate every Compose file
              run: |
                  docker compose --env-file .env.ci --profile apps --file compose.yaml config --quiet
                  docker compose --env-file apps/a2a_agent/.env.example --file apps/a2a_agent/compose.yaml config --quiet
                  docker compose --file apps/main_api/tests/integration/compose.yaml config --quiet
                  docker compose --file apps/mcp_email/tests/integration/compose.yaml config --quiet
                  docker compose --file apps/mcp_data/tests/integration/compose.yaml config --quiet
                  docker compose --file apps/mcp_prediction/tests/integration/compose.yaml config --quiet
                  docker compose --file apps/a2a_agent/tests/integration/compose.yaml config --quiet

            - name: Build all five service images
              run: docker compose --env-file .env.ci --profile apps --file compose.yaml build --parallel

            - name: Start integrated local stack
              run: docker compose --env-file .env.ci --profile apps --file compose.yaml up --detach --wait

            - name: Smoke-check integrated APIs
              run: |
                  docker compose --env-file .env.ci --profile apps --file compose.yaml exec --no-TTY a2a_agent python -c '
                  import os
                  import urllib.error
                  import urllib.request

                  request = urllib.request.Request(
                      "http://127.0.0.1:8000/health/ready",
                      headers={"Authorization": "Bearer " + os.environ["A2A_INTERNAL_SERVICE_TOKEN"]},
                  )
                  try:
                      urllib.request.urlopen(request, timeout=5)
                  except urllib.error.HTTPError as error:
                      detail = error.read().decode("utf-8", errors="replace")
                      raise SystemExit(f"A2A readiness returned HTTP {error.code}: {detail}")
                  '
                  curl --fail-with-body --silent --show-error http://127.0.0.1:8080/health/ready

            - name: Stop integrated local stack
              if: always()
              run: |
                  if [[ -f .env.ci ]]; then
                    docker compose --env-file .env.ci --profile apps --file compose.yaml down --volumes --remove-orphans
                  else
                    echo "Skipping integrated stack cleanup: disposable Compose env was not generated."
                  fi

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.22.1"
                  cache: npm

            - name: Install Node tooling
              run: npm ci

            - name: Audit Node dependencies
              run: npm audit --audit-level=high

            - name: Prettier check
              run: npm run format:check

    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: pylock.toml

            - name: Install Python tooling
              run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r pylock.toml

            - name: Run unit tests
              shell: bash
              run: |
                  mkdir -p reports
                  python -m pytest tests apps packages -m "not integration" --junitxml=reports/pytest.xml --cov=apps --cov=packages --cov-report=xml:reports/coverage.xml

            - name: Publish test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: python-test-reports
                  path: reports/
                  if-no-files-found: ignore

    main-api-integration:
        name: Main API Mongo integration tests
        runs-on: ubuntu-latest
        needs: [quality, unit-tests]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: pylock.toml

            - name: Install Python tooling and main API dependencies
              run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r pylock.toml

            - name: Start disposable integration services
              run: |
                  docker compose --file apps/main_api/tests/integration/compose.yaml up -d --wait auth-postgres mongo
                  docker compose --file apps/main_api/tests/integration/compose.yaml run --rm mongo-init
                  docker compose --file apps/mcp_email/tests/integration/compose.yaml up -d --wait

            - name: Wait for Mongo primary election
              run: |
                  docker compose --file apps/main_api/tests/integration/compose.yaml exec -T mongo mongosh --quiet --eval '
                    let primary = false;
                    for (let attempt = 0; attempt < 60; attempt++) {
                      try { if (rs.status().myState === 1) { primary = true; break; } } catch (e) {}
                      sleep(500);
                    }
                    if (!primary) quit(1);
                  '

            - name: Run main API integration tests
              env:
                  MAIN_API_MONGO_TEST_URI: mongodb://127.0.0.1:27027/?directConnection=true
                  MAIN_API_TEST_AUTH_DATABASE_URL: postgresql://auth_test:auth_test@127.0.0.1:54329/auth_test
                  MCP_EMAIL_RUN_INTEGRATION: "1"
              run: |
                  mkdir -p reports
                  python -m pytest apps/main_api/tests/integration -v --junitxml=reports/main-api-integration.xml

            - name: Run isolated MCP email integration tests
              env:
                  MCP_EMAIL_RUN_INTEGRATION: "1"
              run: python -m pytest apps/mcp_email/tests/integration -v --junitxml=reports/mcp-email-integration.xml

            - name: Stop disposable MCP email services
              if: always()
              run: docker compose --file apps/mcp_email/tests/integration/compose.yaml down --volumes --remove-orphans

            - name: Stop disposable main API services
              if: always()
              run: docker compose --file apps/main_api/tests/integration/compose.yaml down --volumes --remove-orphans

            - name: Publish integration test report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: main-api-integration-report
                  path: reports/*-integration.xml
                  if-no-files-found: ignore

    a2a-integration:
        name: A2A and Qdrant integration tests
        runs-on: ubuntu-latest
        needs: [quality, unit-tests]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: pylock.toml

            - name: Install Python tooling and service dependencies
              run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r pylock.toml

            - name: Start disposable Qdrant
              run: docker compose --file apps/a2a_agent/tests/integration/compose.yaml up -d --wait

            - name: Run A2A integration tests
              env:
                  A2A_RUN_INTEGRATION: "1"
              run: |
                  mkdir -p reports
                  python -m pytest apps/a2a_agent/tests/integration -v --junitxml=reports/a2a-integration.xml

            - name: Stop disposable Qdrant
              if: always()
              run: docker compose --file apps/a2a_agent/tests/integration/compose.yaml down --volumes --remove-orphans

            - name: Publish A2A integration report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: a2a-integration-report
                  path: reports/a2a-integration.xml
                  if-no-files-found: ignore

    mcp-data-prediction-integration:
        name: MCP data and prediction integration tests
        runs-on: ubuntu-latest
        needs: [quality, unit-tests]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: pylock.toml

            - name: Install Python tooling and MCP dependencies
              run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r pylock.toml

            - name: Start disposable MCP databases
              run: |
                  docker compose --file apps/mcp_data/tests/integration/compose.yaml up -d --wait
                  docker compose --file apps/mcp_prediction/tests/integration/compose.yaml up -d --wait

            - name: Run MCP data integration tests
              env:
                  MCP_DATA_RUN_INTEGRATION: "1"
              run: mkdir -p reports && python -m pytest apps/mcp_data/tests/integration -v --junitxml=reports/mcp-data-integration.xml

            - name: Run MCP prediction integration tests
              env:
                  MCP_PREDICTION_RUN_INTEGRATION: "1"
              run: mkdir -p reports && python -m pytest apps/mcp_prediction/tests/integration -v --junitxml=reports/mcp-prediction-integration.xml

            - name: Stop disposable MCP databases
              if: always()
              run: |
                  docker compose --file apps/mcp_data/tests/integration/compose.yaml down --volumes --remove-orphans
                  docker compose --file apps/mcp_prediction/tests/integration/compose.yaml down --volumes --remove-orphans

            - name: Publish MCP integration reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mcp-data-prediction-integration-reports
                  path: reports/*-integration.xml
                  if-no-files-found: ignore
