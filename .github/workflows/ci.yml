name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: |
                      requirements-dev.txt
                      apps/main_api/requirements.txt
                      apps/mcp_email/requirements.txt
                      apps/mcp_email/tests/integration/requirements.txt
                      apps/mcp_data/requirements.txt
                      apps/mcp_prediction/requirements.txt
                      apps/a2a_agent/requirements.txt
                      apps/a2a_agent/tests/integration/requirements.txt

            - name: Install Python tooling
              run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

            - name: Ruff lint
              run: ruff check .

            - name: Ruff format check
              run: ruff format --check .

            - name: Compile Python sources
              shell: bash
              run: |
                  python - <<'PY'
                  import compileall
                  from pathlib import Path

                  roots = [Path("apps"), Path("packages"), Path("tests")]
                  for root in roots:
                      if root.exists() and not compileall.compile_dir(str(root), quiet=1):
                          raise SystemExit(f"compileall failed for {root}")
                  PY

            - name: Audit Python dependencies
              run: pip-audit -r requirements-dev.txt

            - name: Build standalone A2A image
              run: docker build --file apps/a2a_agent/Dockerfile --tag argos-a2a-agent:ci .

            - name: Validate standalone A2A Compose
              run: |
                  cp apps/a2a_agent/.env.example apps/a2a_agent/.env
                  docker compose --env-file apps/a2a_agent/.env.example --file apps/a2a_agent/compose.yaml config --quiet

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.22.1"
                  cache: npm

            - name: Install Node tooling
              run: npm ci

            - name: Prettier check
              run: npm run format:check

    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: |
                      requirements-dev.txt
                      apps/main_api/requirements.txt
                      apps/mcp_email/requirements.txt
                      apps/mcp_data/requirements.txt
                      apps/a2a_agent/requirements.txt

            - name: Install Python tooling
              run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

            - name: Run unit tests
              shell: bash
              run: |
                  mkdir -p reports
                  mapfile -t test_files < <(find apps packages tests -type f \( -path '*/tests/unit/test_*.py' -o -path '*/tests/unit/*_test.py' -o -path 'tests/unit/test_*.py' -o -path 'tests/unit/*_test.py' \) 2>/dev/null || true)
                  if [ "${#test_files[@]}" -eq 0 ]; then
                    echo "No Python tests found yet; skipping pytest."
                    exit 0
                  fi
                  pytest "${test_files[@]}" --junitxml=reports/pytest.xml --cov=apps --cov=packages --cov-report=xml:reports/coverage.xml

            - name: Publish test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: python-test-reports
                  path: reports/
                  if-no-files-found: ignore

    main-api-integration:
        name: Main API Mongo integration tests
        runs-on: ubuntu-latest
        needs: [quality, unit-tests]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: |
                      requirements-dev.txt
                      apps/main_api/requirements.txt
                      apps/mcp_email/tests/integration/requirements.txt

            - name: Install Python tooling and main API dependencies
              run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt -r apps/mcp_email/tests/integration/requirements.txt

            - name: Start disposable Mongo replica set
              run: |
                  docker compose --file apps/main_api/tests/integration/compose.yaml up -d --wait mongo
                  docker compose --file apps/main_api/tests/integration/compose.yaml run --rm mongo-init
                  docker compose --file apps/mcp_email/tests/integration/compose.yaml up -d --wait

            - name: Wait for Mongo primary election
              run: |
                  docker compose --file apps/main_api/tests/integration/compose.yaml exec -T mongo mongosh --quiet --eval '
                    let primary = false;
                    for (let attempt = 0; attempt < 60; attempt++) {
                      try { if (rs.status().myState === 1) { primary = true; break; } } catch (e) {}
                      sleep(500);
                    }
                    if (!primary) quit(1);
                  '

            - name: Run main API integration tests
              env:
                  MAIN_API_MONGO_TEST_URI: mongodb://127.0.0.1:27027/?directConnection=true
                  MCP_EMAIL_RUN_INTEGRATION: "1"
              run: |
                  mkdir -p reports
                  pytest apps/main_api/tests/integration -v --junitxml=reports/main-api-integration.xml

            - name: Run isolated MCP email integration tests
              env:
                  MCP_EMAIL_RUN_INTEGRATION: "1"
              run: pytest apps/mcp_email/tests/integration -v --junitxml=reports/mcp-email-integration.xml

            - name: Stop disposable MCP email services
              if: always()
              run: docker compose --file apps/mcp_email/tests/integration/compose.yaml down --volumes --remove-orphans

            - name: Stop disposable Mongo replica set
              if: always()
              run: docker compose --file apps/main_api/tests/integration/compose.yaml down --volumes --remove-orphans

            - name: Publish integration test report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: main-api-integration-report
                  path: reports/*-integration.xml
                  if-no-files-found: ignore

    a2a-integration:
        name: A2A and Qdrant integration tests
        runs-on: ubuntu-latest
        needs: [quality, unit-tests]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: |
                      requirements-dev.txt
                      apps/a2a_agent/requirements.txt
                      apps/a2a_agent/tests/integration/requirements.txt
                      apps/main_api/requirements.txt

            - name: Install Python tooling and service dependencies
              run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt -r apps/a2a_agent/tests/integration/requirements.txt

            - name: Start disposable Qdrant
              run: docker compose --file apps/a2a_agent/tests/integration/compose.yaml up -d --wait

            - name: Run A2A integration tests
              env:
                  A2A_RUN_INTEGRATION: "1"
              run: |
                  mkdir -p reports
                  pytest apps/a2a_agent/tests/integration -v --junitxml=reports/a2a-integration.xml

            - name: Stop disposable Qdrant
              if: always()
              run: docker compose --file apps/a2a_agent/tests/integration/compose.yaml down --volumes --remove-orphans

            - name: Publish A2A integration report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: a2a-integration-report
                  path: reports/a2a-integration.xml
                  if-no-files-found: ignore
