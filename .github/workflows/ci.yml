name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: |
                      requirements-dev.txt
                      apps/main_api/requirements.txt
                      apps/mcp_email/requirements.txt
                      apps/mcp_data/requirements.txt

            - name: Install Python tooling
              run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

            - name: Ruff lint
              run: ruff check .

            - name: Ruff format check
              run: ruff format --check .

            - name: Compile Python sources
              shell: bash
              run: |
                  python - <<'PY'
                  import compileall
                  from pathlib import Path

                  roots = [Path("apps"), Path("packages"), Path("tests")]
                  for root in roots:
                      if root.exists() and not compileall.compile_dir(str(root), quiet=1):
                          raise SystemExit(f"compileall failed for {root}")
                  PY

            - name: Audit Python dependencies
              run: pip-audit -r requirements-dev.txt

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.22.1"
                  cache: npm

            - name: Install Node tooling
              run: npm ci

            - name: Prettier check
              run: npm run format:check

    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.14.3
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
                  cache: pip
                  cache-dependency-path: |
                      requirements-dev.txt
                      apps/main_api/requirements.txt
                      apps/mcp_email/requirements.txt
                      apps/mcp_data/requirements.txt

            - name: Install Python tooling
              run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

            - name: Run unit tests
              shell: bash
              run: |
                  mkdir -p reports
                  mapfile -t test_files < <(find apps packages tests -type f \( -path '*/tests/unit/test_*.py' -o -path '*/tests/unit/*_test.py' -o -path 'packages/*/tests/test_*.py' -o -path 'packages/*/tests/*_test.py' -o -path 'tests/unit/test_*.py' -o -path 'tests/unit/*_test.py' \) 2>/dev/null || true)
                  if [ "${#test_files[@]}" -eq 0 ]; then
                    echo "No Python tests found yet; skipping pytest."
                    exit 0
                  fi
                  pytest "${test_files[@]}" --junitxml=reports/pytest.xml --cov=apps --cov=packages --cov-report=xml:reports/coverage.xml

            - name: Publish test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: python-test-reports
                  path: reports/
                  if-no-files-found: ignore
