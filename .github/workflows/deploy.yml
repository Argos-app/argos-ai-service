name: Deploy Render

on:
    push:
        branches: [develop, main]
    workflow_dispatch:

# Serialize toda a publicação. Recupere publicações incompletas implantando os cinco
# serviços, inclusive alterações revertidas após uma implantação parcial.
concurrency:
    group: render-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    actions: read

jobs:
    plan:
        name: Select services and environment
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        outputs:
            services: ${{ steps.services.outputs.services }}
            has_changes: ${{ steps.services.outputs.has_changes }}
            environment: ${{ steps.services.outputs.environment }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"

            - name: Find deployment baseline
              id: baseline
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data } = await github.rest.actions.listWorkflowRuns({
                        ...context.repo,
                        workflow_id: 'deploy.yml',
                        branch: context.ref.replace('refs/heads/', ''),
                        status: 'completed',
                        per_page: 1,
                      });
                      const previous = data.workflow_runs[0];
                      core.setOutput('sha', previous?.conclusion === 'success' ? previous.head_sha : '');

            - name: Select affected services
              id: services
              env:
                  BASE_SHA: ${{ steps.baseline.outputs.sha }}
                  DEPLOY_SHA: ${{ github.sha }}
                  DEPLOY_BRANCH: ${{ github.ref_name }}
                  FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
              run: python scripts/render/plan.py

    ci:
        name: Wait for CI of the exact commit
        needs: plan
        if: needs.plan.outputs.has_changes == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        steps:
            - uses: actions/github-script@v7
              with:
                  script: |
                      const deadline = Date.now() + 30 * 60 * 1000;
                      while (Date.now() < deadline) {
                        const { data } = await github.rest.actions.listWorkflowRuns({
                          ...context.repo,
                          workflow_id: 'ci.yml',
                          branch: context.ref.replace('refs/heads/', ''),
                          head_sha: context.sha,
                          per_page: 100,
                        });
                        const acceptedEvents = context.eventName === 'workflow_dispatch'
                          ? ['push', 'workflow_dispatch'] : ['push'];
                        const run = data.workflow_runs.find(item => acceptedEvents.includes(item.event));
                        if (run?.status === 'completed') {
                          if (run.conclusion !== 'success') {
                            throw new Error(`CI ${run.id}: ${run.conclusion}. Deployment blocked.`);
                          }
                          core.info(`CI passed: ${run.html_url}`);
                          return;
                        }
                        await new Promise(resolve => setTimeout(resolve, 15000));
                      }
                      throw new Error('Timed out waiting for CI of this commit.');

    deploy:
        name: Deploy ${{ matrix.service }} to ${{ needs.plan.outputs.environment }}
        needs: [plan, ci]
        if: needs.plan.outputs.has_changes == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: ${{ needs.plan.outputs.environment }}
        strategy:
            fail-fast: false
            matrix:
                service: ${{ fromJSON(needs.plan.outputs.services) }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"

            - name: Deploy source and wait until live
              env:
                  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
                  RENDER_SERVICE_ID: ${{ secrets[format('RENDER_SERVICE_ID_{0}', matrix.service)] }}
                  DEPLOY_SHA: ${{ github.sha }}
                  DEPLOY_BRANCH: ${{ github.ref_name }}
              run: python scripts/render/deploy.py
