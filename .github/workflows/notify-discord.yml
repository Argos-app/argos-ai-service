name: Notificações do Discord
on:
  pull_request:
    types: [opened, closed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions: {}
jobs:
  pr_notification:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Notificar Abertura de PR
        if: github.event.action == 'opened'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD: >-
            {
              "embeds": [{
                "title": "📦 Novo Pull Request aberto!",
                "color": 409903,
                "fields": [
                  { "name": "Título", "value": ${{ toJson(github.event.pull_request.title) }}, "inline": false },
                  { "name": "Autor", "value": ${{ toJson(github.event.pull_request.user.login) }}, "inline": true },
                  { "name": "Branch", "value": ${{ toJson(format('`{0}`', github.event.pull_request.head.ref)) }}, "inline": true },
                  { "name": "Link", "value": ${{ toJson(format('[Ver Pull Request]({0})', github.event.pull_request.html_url)) }}, "inline": false },
                  { "name": "Repositório", "value": ${{ toJson(github.event.repository.name) }}, "inline": true }
                ]
              }]
            }
        run: |
          echo "$PAYLOAD" > payload.json
          curl -s -X POST -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK

      - name: Notificar Merge de PR
        if: github.event.pull_request.merged == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD: >-
            {
              "embeds": [{
                "title": "🔀 Pull Request Mergeado!",
                "color": 6470477,
                "fields": [
                  { "name": "PR", "value": ${{ toJson(github.event.pull_request.title) }}, "inline": false },
                  { "name": "Por", "value": ${{ toJson(github.actor) }}, "inline": true },
                  { "name": "Link", "value": ${{ toJson(format('[Ver PR Mergeado]({0})', github.event.pull_request.html_url)) }}, "inline": false },
                  { "name": "Repositório", "value": ${{ toJson(github.event.repository.name) }}, "inline": true }
                ]
              }]
            }
        run: |
          echo "$PAYLOAD" > payload.json
          curl -s -X POST -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK

  comments_notification:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
    steps:
      - name: Notificar Novo Comentário
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD: >-
            {
              "embeds": [{
                "title": "💬 Novo comentário recebido",
                "color": 15844367,
                "fields": [
                  { "name": "Autor", "value": ${{ toJson(github.actor) }}, "inline": true },
                  { "name": "Comentário", "value": ${{ toJson(github.event.comment.body) }}, "inline": false },
                  { "name": "Link", "value": ${{ toJson(format('[Ir para o comentário]({0})', github.event.comment.html_url)) }}, "inline": false },
                  { "name": "Repositório", "value": ${{ toJson(github.event.repository.name) }}, "inline": true }
                ]
              }]
            }
        run: |
          echo "$PAYLOAD" > payload.json
          curl -s -X POST -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK
