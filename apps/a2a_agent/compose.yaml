name: argos-a2a-agent

services:
    a2a:
        build:
            context: ../..
            dockerfile: apps/a2a_agent/Dockerfile
        image: argos-a2a-agent:local
        init: true
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        environment:
            A2A_HOST: 0.0.0.0
            A2A_PORT: 8000
            A2A_ENDPOINT_URL: ${A2A_ENDPOINT_URL:?configure A2A_ENDPOINT_URL in apps/a2a_agent/.env}
            A2A_DOCUMENT_SOURCE_ROOT: /var/lib/argos/a2a/documents
            A2A_MANIFEST_PATH: /var/lib/argos/a2a/state/manifest.json
        ports:
            - "127.0.0.1:${A2A_PUBLISHED_PORT:-8000}:8000"
        volumes:
            - ${A2A_DOCUMENTS_PATH:-./data/documents}:/var/lib/argos/a2a/documents:ro
            - a2a-state:/var/lib/argos/a2a/state
        read_only: true
        tmpfs:
            - /tmp:mode=1777,size=16m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        mem_limit: 1g
        cpus: 1.0
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 20s

volumes:
    a2a-state:
