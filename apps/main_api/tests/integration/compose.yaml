name: argos-main-api-integration

services:
    mongo:
        image: mongo:7.0
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
        ports:
            - "127.0.0.1:27027:27017"
        tmpfs:
            - /data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
            interval: 2s
            timeout: 5s
            retries: 30

    mongo-init:
        image: mongo:7.0
        depends_on:
            mongo:
                condition: service_healthy
        entrypoint:
            - /bin/bash
            - -ec
            - >-
                mongosh mongodb://mongo:27017/admin --quiet --eval
                'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'
        restart: "no"
