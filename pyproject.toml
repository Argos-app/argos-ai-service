[project]
name = "argos-ai-service"
version = "0.1.0"
description = "Argos AI services monorepo"
requires-python = ">=3.14.3,<3.15"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = [".", "apps/mcp_email/src", "apps/mcp_data/src"]
addopts = "-ra"
markers = ["integration: exige os serviços descartáveis do compose de integração"]
